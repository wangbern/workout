<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8ec8f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Liping's Workout">
  <title>Liping's Workout Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div id="view"></div>

  <div id="phone-face">
    <div class="top-half">
    <div class="crest">
      <div class="earpiece" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="lens" aria-hidden="true"></div>
    </div>

    <div class="bezel">
      <div class="lcd">
        <button type="button" id="signal" class="hud signal" aria-pressed="false">
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
        <button type="button" id="recap" class="hud mail" disabled>
          <svg viewBox="0 0 28 20" width="42" height="30" aria-hidden="true">
            <rect x="1.6" y="1.6" width="24.8" height="16.8" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <path d="M2.4 3.2 L14 11.4 L25.6 3.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          </svg>
        </button>
        <p id="day-label" class="day-label"></p>

        <button type="button" id="battery" class="batt-block">
          <span class="batt" aria-hidden="true">
            <span id="batt-fill" class="batt-fill"></span>
            <span class="batt-nub"></span>
          </span>
          <span id="remain" class="batt-label main"></span>
        </button>
        <p id="local-end" class="sr-only"></p>
        <p id="both-end" class="sr-only"></p>

        <div class="anchor-monster">
          <div class="stage-wrap">
            <div id="home-stage" class="stage"></div>
            <div id="pick-stage" class="stage" hidden></div>
          </div>
          <div id="pips" class="hp" style="--hp: 1" aria-hidden="true"><span class="hp-fill"></span></div>
        </div>

        <div id="figures" class="figures anchor-figures"></div>
        <div id="pw-box" class="pw-box" aria-hidden="true" hidden><span id="pw-text" class="pw-text"></span><i class="pw-caret"></i></div>
        <p id="future-mark" class="future-mark" hidden>?</p>

        <p id="hint" class="hint" hidden></p>
        <p id="monster-name" class="lcd-desc"></p>
        <p id="desc-live" class="sr-only" aria-live="polite"></p>

        <div id="recap-layer" class="recap-layer" hidden>
          <div id="recap-stage" class="recap-stage"></div>
          <div id="recap-trio" class="recap-trio" hidden></div>
          <p id="recap-caption" class="recap-caption" aria-live="polite"></p>
        </div>

        <div id="boot" class="boot-layer" aria-hidden="true">
          <canvas id="boot-noise" class="boot-noise" width="222" height="178"></canvas>
          <div class="boot-dots"><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
    </div>

    <div class="hinge-gap" aria-hidden="true"></div>

    <div class="bottom-half">
    <div class="deck">
      <div class="deck-top">
        <button type="button" id="switch-name" class="deck-side"></button>
        <button type="button" id="lang-toggle" class="deck-side">中文</button>
      </div>
      <div class="deck-nav">
        <button type="button" id="day-prev" class="deck-arrow deck-arrow-prev" aria-label="Previous day">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path fill="url(#arrow-key)" stroke="#6d90b0" stroke-width="1.25" vector-effect="non-scaling-stroke" d="M 29.47 39.27 L 74.63 16.68 A 12 12 0 0 1 92 27.42 L 92 72.58 A 12 12 0 0 1 74.63 83.32 L 29.47 60.73 A 12 12 0 0 1 29.47 39.27 Z"/>
          </svg>
        </button>
        <button type="button" id="replay" class="deck-replay" aria-label="Replay"></button>
        <button type="button" id="day-next" class="deck-arrow deck-arrow-next" aria-label="Next day">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path fill="url(#arrow-key)" stroke="#6d90b0" stroke-width="1.25" vector-effect="non-scaling-stroke" d="M 70.53 39.27 L 25.37 16.68 A 12 12 0 0 0 8 27.42 L 8 72.58 A 12 12 0 0 0 25.37 83.32 L 70.53 60.73 A 12 12 0 0 0 70.53 39.27 Z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="keypad">
      <h2 id="who" class="sr-only"></h2>
      <div id="options" class="options"></div>
      <div id="who-choices" class="choices" role="group" aria-labelledby="who" hidden></div>
      <div class="mic" aria-hidden="true"></div>
    </div>
    </div>
    <div id="face-stickers" class="face-stickers"></div>
    <h1 id="title-sticker" class="title-sticker" hidden></h1>
  </div>

  <input id="pw-input" class="pw-input" type="text" maxlength="24" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" tabindex="-1" aria-label="Password">

  <button type="button" id="decorate" class="decorate-btn" aria-pressed="false" aria-label="Decorate">
    <img src="images/paintbrush.png" alt="" width="40" height="40">
  </button>
  <div id="color-col" class="deco-col deco-left" hidden></div>
  <div id="sticker-col" class="deco-col deco-right" hidden></div>
  <div id="sticker-ghost" class="sticker-ghost" hidden></div>

  <svg class="deck-arrow-defs" width="0" height="0" aria-hidden="true">
    <defs>
      <linearGradient id="arrow-key" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/>
        <stop offset="46%" stop-color="#d7e4f2"/>
        <stop offset="88%" stop-color="#b5cce2"/>
        <stop offset="100%" stop-color="#8eabc8"/>
      </linearGradient>
      <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="150" y2="28" spreadMethod="repeat">
        <stop offset="0%" stop-color="#ff9ec7"/>
        <stop offset="16%" stop-color="#ffbd94"/>
        <stop offset="32%" stop-color="#ffe082"/>
        <stop offset="48%" stop-color="#9fe6b0"/>
        <stop offset="64%" stop-color="#93d8f5"/>
        <stop offset="80%" stop-color="#a5b1ff"/>
        <stop offset="90%" stop-color="#d2a6ff"/>
        <stop offset="100%" stop-color="#ff9ec7"/>
        <animate attributeName="x1" values="0;150" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="150;300" dur="3.2s" repeatCount="indefinite"/>
      </linearGradient>
      <linearGradient id="holo-bright" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="150" y2="28" spreadMethod="repeat">
        <stop offset="0%" stop-color="#ff3d9a"/>
        <stop offset="16%" stop-color="#ff8a1f"/>
        <stop offset="32%" stop-color="#f5c400"/>
        <stop offset="48%" stop-color="#22c96b"/>
        <stop offset="64%" stop-color="#12b5e8"/>
        <stop offset="80%" stop-color="#5b6bff"/>
        <stop offset="90%" stop-color="#b44dff"/>
        <stop offset="100%" stop-color="#ff3d9a"/>
        <animate attributeName="x1" values="0;150" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="150;300" dur="3.2s" repeatCount="indefinite"/>
      </linearGradient>
      <linearGradient id="holo-sheen" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="-40" y2="30">
        <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#fff" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        <animate attributeName="x1" values="-120;460" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-40;540" dur="2.6s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="lang-group" class="sr-only" role="group"></div>

  <script src="config.js"></script>
  <script src="day.js"></script>
  <script src="monster.js"></script>
  <script src="app.js"></script>
  <script type="module" src="phone.js"></script>
</body>
</html>
